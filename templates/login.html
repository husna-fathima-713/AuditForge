<!DOCTYPE html>
<html>

<head>

    <title>AuditForge Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>AuditForge Login</h1>

<form method="POST">

    <label>Username</label>

    <input
        type="text"
        name="username"
        required>

    <br><br>

    <label>Password</label>

    <input
        type="password"
        name="password"
        required>

    <br><br>

    <button type="submit">

        Login

    </button>

</form>

{% if error %}

<p style="color:red">

{{ error }}

</p>

{% endif %}

</div>

</body>

</html>
